name: images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image:
        description: 'Dockerfile suffix to build without publishing, such as devkitA64'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/chiaki-ng

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      images: ${{ steps.plan.outputs.images }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          dockerfile_for() {
            ls -1 | grep -qFx "Dockerfile.$1" \
              || { echo "::error::no Dockerfile.$1; the release tag must be <suffix>-<ddmmyy> with the Dockerfile's suffix exactly" >&2; exit 1; }
            printf 'Dockerfile.%s\n' "$1"
          }
          publish=false
          version=""
          files=""
          if [ "$EVENT" = release ]; then
            printf '%s' "$RELEASE_TAG" | grep -qE '^[A-Za-z0-9._]+-[0-9]{6}$' \
              || { echo "::error::release tag '$RELEASE_TAG' must be <suffix>-<ddmmyy>" >&2; exit 1; }
            git fetch --quiet origin main
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main \
              || { echo "::error::release tag $RELEASE_TAG is not on main; refusing to publish" >&2; exit 1; }
            files=$(dockerfile_for "${RELEASE_TAG%-*}")
            version=${RELEASE_TAG##*-}
            publish=true
          else
            files=$(dockerfile_for "$INPUT_IMAGE")
          fi
          matrix=$(for f in $files; do
            [ -f "$f" ] || continue
            name=$(printf '%s' "${f#Dockerfile.}" | tr '[:upper:]' '[:lower:]')
            for arch in amd64 arm64; do
              runner=ubuntu-24.04
              [ "$arch" = arm64 ] && runner=ubuntu-24.04-arm
              jq -cn --arg image "$name" --arg dockerfile "$f" --arg version "$version" --arg arch "$arch" --arg runner "$runner" \
                '{image: $image, dockerfile: $dockerfile, version: $version, arch: $arch, runner: $runner}'
            done
          done | jq -sc '{include: .}')
          images=$(printf '%s' "$matrix" | jq -c '[.include[] | {image, dockerfile, version}] | unique')
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "images=$images" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "publish=$publish"
          printf '%s\n' "$matrix" | jq -r '.include[] | "  \(.image) \(.arch) from \(.dockerfile)"'

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ needs.plan.outputs.publish == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, matrix.image) || 'type=cacheonly' }}
      - if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch tags and the release report
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          VERSION: ${{ matrix.version }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          DIGESTS: ${{ runner.temp }}/digests
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            $(for d in "$DIGESTS"/*; do printf '%s@sha256:%s ' "$IMAGE" "${d##*/}"; done)
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          notes="$RUNNER_TEMP/notes.md"
          {
            printf 'Published `%s:%s` for linux/amd64 and linux/arm64 from `%s`.\n\n' "$IMAGE" "$VERSION" "$DOCKERFILE"
            printf 'Pin it as:\n\n```\n%s@%s\n```\n\n' "$IMAGE" "$digest"
            printf 'Built on `%s`.\n\n' "$(sed -n 's/^FROM //p' "$DOCKERFILE" | head -1)"
            report="report/${DOCKERFILE#Dockerfile.}.sh"
            if [ -f "$report" ]; then
              docker run --rm -v "$PWD/report:/report:ro" "$IMAGE@$digest" bash "/report/${report##*/}"
            fi
          } >"$notes"
          gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --notes-file "$notes"
          cat "$notes" >>"$GITHUB_STEP_SUMMARY"
